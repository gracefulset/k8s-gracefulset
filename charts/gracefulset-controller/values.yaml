# Default values for gracefulset-controller

replicaCount: 2

image:
  repository: pradyumnakashyap/gracefulset-controller
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: gracefulset-controller

leaderElection:
  enabled: true
# Only manage GracefulSets in this namespace ("" = all namespaces)
watchNamespace: ""
rbac:
  # Grant pods/exec, needed only for Exec drain checks. This lets the controller
  # exec into any pod it can see, so it is off by default.
  podExec: false
# GracefulSets reconciled in parallel
maxConcurrentReconciles: 4
# PodDisruptionBudget for the controller pods (only rendered when replicaCount > 1)
podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  port: 8080
  # Expose metrics through a Service (e.g. for a Prometheus ServiceMonitor)
  service:
    enabled: false

health:
  port: 8081
